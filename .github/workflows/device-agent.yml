name: device-agent

on:
  push:
    branches: [main]
    paths: ["device-agent/**", "packages/**", ".github/workflows/device-agent.yml"]
  pull_request:
    paths: ["device-agent/**", "packages/**", ".github/workflows/device-agent.yml"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The registers run Windows: token encryption (DPAPI) and the service wrapper
        # are only exercised on the Windows runner.
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: device-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,windows,serial]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy nextcam_agent --exclude service.py
      - run: pytest -q
