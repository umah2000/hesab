name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "packages/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "packages/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CiOnly_Passw0rd2026
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiOnly_Passw0rd2026 -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      # throwaway CI-only container; not a real credential
      SA_PASSWORD: CiOnly_Passw0rd2026
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ODBC Driver 18
        run: |
          # The runner image may lack odbcinst yet already have the Microsoft keyring:
          # --batch --yes, or gpg asks to overwrite it on a missing TTY and fails.
          if ! (command -v odbcinst >/dev/null && odbcinst -q -d | grep -q "ODBC Driver 18"); then
            curl -sSL https://packages.microsoft.com/keys/microsoft.asc | sudo gpg --batch --yes --dearmor -o /usr/share/keyrings/microsoft-prod.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/ubuntu/24.04/prod noble main" | sudo tee /etc/apt/sources.list.d/mssql-release.list
            sudo apt-get update
            sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
          fi
      - name: Create test database
        run: |
          docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$SA_PASSWORD" -Q "CREATE DATABASE nextcam_test"
      - run: pip install -e ../packages/nextcam-core -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - name: Tests (real SQL Server)
        env:
          TEST_DATABASE_URL: mssql+pyodbc://sa:${{ env.SA_PASSWORD }}@127.0.0.1:1433/nextcam_test?driver=ODBC+Driver+18+for+SQL+Server&TrustServerCertificate=yes
        run: pytest -q --cov=app
